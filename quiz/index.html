<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>民謡クイズ レシート｜SVG×JS</title>
<meta name="theme-color" content="#222222">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:#2b2b2e; font-family:"Courier New", ui-monospace, monospace;
         display:flex; flex-direction:column; align-items:center; min-height:100dvh; padding:14px 0 42px; }
  svg { display:block; }
  .printer-wrap { width:min(94vw,400px); }
  .receipt { position:relative; width:min(94vw,384px); background:#fdfdf8; color:#111;
             padding:20px 20px 0; font-size:15px; line-height:1.65; }
  .c{text-align:center} .b{font-weight:bold} .big{font-size:22px; letter-spacing:.15em}
  .dash{border-top:2px dashed #111; margin:10px 0} .thin{border-top:1px solid #111; margin:8px 0}
  .row{display:flex; justify-content:space-between; gap:8px}
  .q{font-size:18px; font-weight:bold; line-height:1.6; margin:8px 0 4px}
  .a{background:#111; color:#fdfdf8; padding:10px 12px; margin:10px 0; line-height:1.6}
  .a .lbl{font-size:11px; letter-spacing:.3em; opacity:.7}
  button{font-family:inherit; width:100%; padding:14px; font-size:16px; font-weight:bold;
         background:#fdfdf8; border:2px solid #111; margin:6px 0; cursor:pointer}
  button:active{background:#111; color:#fdfdf8}
  .judge{display:flex; gap:8px} .judge button{flex:1}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
  .chip{width:auto; padding:6px 10px; font-size:12px; margin:0; border-width:1px}
  .chip.on{background:#111; color:#fdfdf8}
  #log{font-size:12.5px; line-height:1.7; word-break:break-all}
  .small{font-size:11.5px} .mut{opacity:.65}
  #stamp{position:absolute; right:14px; top:118px; transform:rotate(-12deg); opacity:0; transition:opacity .15s}
  #stamp.show{opacity:.9}
  .tear{width:min(94vw,384px); margin-top:-1px}
</style>
</head>
<body>
<div class="printer-wrap">
  <!-- プリンタ本体：SVG描画 -->
  <svg viewBox="0 0 400 74" width="100%" role="img" aria-label="レシートプリンタ">
    <rect x="6" y="10" width="388" height="56" rx="12" fill="#141414"/>
    <rect x="6" y="10" width="388" height="20" rx="10" fill="#1e1e1e"/>
    <circle cx="34" cy="26" r="5" fill="#7ee787"/>
    <text x="52" y="31" font-family="monospace" font-size="11" fill="#9a9a9a" letter-spacing="3">MINYO QUIZ PRINTER</text>
    <text x="368" y="31" font-family="monospace" font-size="10" fill="#666" text-anchor="end">58mm</text>
    <rect x="26" y="46" width="348" height="9" rx="4.5" fill="#000"/>
    <rect x="26" y="48.5" width="348" height="2" fill="#333"/>
  </svg>
</div>

<main class="receipt" id="receipt">
  <!-- 土地スタンプ：JSが土地ごとに差し替え -->
  <svg id="stamp" width="76" height="76" viewBox="0 0 76 76">
    <circle cx="38" cy="38" r="34" fill="none" stroke="#b84935" stroke-width="3"/>
    <circle cx="38" cy="38" r="27" fill="none" stroke="#b84935" stroke-width="1.5"/>
    <text id="stampLand" x="38" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#b84935">安来</text>
    <text id="stampSub" x="38" y="54" text-anchor="middle" font-size="10" fill="#b84935">島根</text>
  </svg>

  <div class="c b big">民謡クイズ</div>
  <div class="c">* * * RECEIPT QUIZ * * *</div>
  <div class="c small">安来節 ・ おてもやん ・ 江州音頭</div>
  <div class="dash"></div>
  <div class="row small"><span id="date"></span><span id="no">No.0001</span></div>
  <div class="row small"><span>出題は無限ループします</span><span id="loop">1周目</span></div>
  <div class="dash"></div>
  <div class="small b">土地フィルタ</div>
  <div class="chips" id="chips">
    <button class="chip on" data-land="all">ぜんぶ</button>
    <button class="chip" data-land="安来節（島根）">安来節</button>
    <button class="chip" data-land="おてもやん（熊本）">おてもやん</button>
    <button class="chip" data-land="江州音頭（滋賀）">江州音頭</button>
  </div>
  <div class="dash"></div>
  <div class="row"><span id="land" class="b"></span><span id="level"></span></div>
  <div class="q" id="q">読み込み中…</div>
  <div id="answer" class="a" hidden><div class="lbl">ANSWER</div><div id="atext"></div></div>
  <button id="show">答えを見る</button>
  <div class="judge" id="judge" hidden>
    <button id="ok">◎ できた</button>
    <button id="ng">× まだ</button>
  </div>
  <div class="dash"></div>
  <div class="row"><span>出題数</span><span id="cnt">0 問</span></div>
  <div class="row"><span>正解（自己判定）</span><span id="score">0 点</span></div>
  <div class="row"><span>連続正解</span><span id="streak">0</span></div>
  <div class="row b" style="font-size:18px"><span>合計</span><span id="total">0 点</span></div>
  <div class="thin"></div>
  <div class="small b">--- お会計明細（履歴）---</div>
  <div id="log"><span class="mut">まだ何も印刷されていません</span></div>
  <div class="dash"></div>
  <div class="c small">ありがとうございました<br>またのお越しを（無限に）</div>
  <!-- バーコード：JSがレシート番号＋合計から毎回生成 -->
  <svg id="barcode" viewBox="0 0 300 54" width="78%" style="margin:10px auto 0"></svg>
  <div class="c small mut" id="barcodeText" style="padding-bottom:6px">MINYO-QUIZ</div>
</main>
<!-- 切り口ギザギザ：SVGポリゴン -->
<svg class="tear" viewBox="0 0 384 10" preserveAspectRatio="none" height="10" aria-hidden="true">
  <polygon id="tearPoly" fill="#fdfdf8" points=""/>
</svg>

<script>
const QUIZ = [{"land": "安来節（島根）", "level": "簡単", "q": "安来節は、どこの民謡でしょう？", "a": "島根県安来市（出雲の民謡）"}, {"land": "安来節（島根）", "level": "簡単", "q": "安来節の合間に踊られる、滑稽な踊りの名前は？", "a": "どじょうすくい踊り"}, {"land": "安来節（島根）", "level": "簡単", "q": "その踊りで、鼻につけるものは何でしょう？", "a": "一文銭（鼻あて）。豆絞りの手ぬぐいを頭に、腰にはビク（魚籠）を下げる"}, {"land": "安来節（島根）", "level": "簡単", "q": "踊るとき手に持つ、すくうための道具は？", "a": "ザル（竹ざる）"}, {"land": "安来節（島根）", "level": "簡単", "q": "江戸時代、安来に各地の唄を運んできた船の名前は？", "a": "北前船。安来は鉄と米の積出港で、船頭たちが全国の民謡を持ち込み、持ち帰った"}, {"land": "安来節（島根）", "level": "むずかし", "q": "明治の終わり、全国巡業とレコードで安来節の黄金時代を築いた「初代」と呼ばれる唄い手は誰？", "a": "渡部お糸（初代）。三味線の富田徳之助（ジャバ徳）と一座を組み、全国を回った。家元は代々「渡部お糸」を襲名する"}, {"land": "安来節（島根）", "level": "むずかし", "q": "正調安来節保存会が設立されたのは何年？", "a": "1911年（明治44年）。乱れつつあった安来節の正調を守るために設立。2014年には安来市の無形民俗文化財に指定"}, {"land": "安来節（島根）", "level": "むずかし", "q": "どじょうすくいの所作は、実はどじょう取りではなく、ある労働の動きが元だという説があります。何の労働でしょう？", "a": "砂鉄採取。安来鋼を作るたたら製鉄の原料・砂鉄を川で集める所作が、踊りに取り込まれたという説"}, {"land": "安来節（島根）", "level": "むずかし", "q": "安来節の原型の一つとされる、土地の唄の名前は？（天保の頃、芸妓おさんが歌ったと伝わる）", "a": "さんこ節"}, {"land": "安来節（島根）", "level": "むずかし", "q": "安来節は2016年、ある日本遺産の構成文化財に認定されました。その日本遺産の名前は？", "a": "日本遺産「出雲國たたら風土記」"}, {"land": "おてもやん（熊本）", "level": "簡単", "q": "おてもやんは、どこの民謡でしょう？", "a": "熊本県（肥後）の民謡"}, {"land": "おてもやん（熊本）", "level": "簡単", "q": "「おてもやん」の「やん」は、標準語の何にあたりますか？", "a": "「さん」。つまり「おてもさん」"}, {"land": "おてもやん（熊本）", "level": "簡単", "q": "歌い出しで「あんたこの頃、どうしたではないかいな」と聞かれるのは何？", "a": "嫁入り（結婚）した"}, {"land": "おてもやん（熊本）", "level": "簡単", "q": "それをしたのに、まだ三々九度の杯（さかずき）をしていないのはなぜ？", "a": "亭主が「ぐじゃっぺ」（熊本弁で不細工、あばた顔）だから。「嫁入りしたこつぁしたばってん、ご亭どんがぐじゃっぺだるけん、まあだ盃ゃせんだった」"}, {"land": "おてもやん（熊本）", "level": "簡単", "q": "おてもやんが、もともと呼ばれていた名前は？", "a": "熊本甚句。花柳界のお座敷歌だった"}, {"land": "おてもやん（熊本）", "level": "むずかし", "q": "おてもやんを作詞・作曲（編曲）した、三味線と踊りの師匠の名前は？", "a": "永田イネ（1865–1938）。「おてもやんあんたこの頃」と「一つ山越え」の2節はイネの作詞とされる"}, {"land": "おてもやん（熊本）", "level": "むずかし", "q": "1936年（昭和11年）にレコードへ吹き込み、全国に広めるきっかけを作った歌手は？", "a": "赤坂小梅"}, {"land": "おてもやん（熊本）", "level": "むずかし", "q": "おてもやんのモデルとされる、師匠の弟子だった女性の名前は？", "a": "富永チモ（登茂）。小作農家の長女で、イネのもとに通っていた女性。ただしイネ自身はモデルを最後まで公表しなかった"}, {"land": "おてもやん（熊本）", "level": "むずかし", "q": "1907年、与謝野鉄幹・北原白秋らの紀行文に記録され、東京でも流行するきっかけになった作品の題名は？", "a": "「五足の靴」"}, {"land": "おてもやん（熊本）", "level": "むずかし", "q": "歌の後半、「男振りには惚れんばな（男の見かけには惚れないが）」のあと、おてもやんが惚れたのは何？", "a": "煙草入れの銀金具。「それがそもそも因縁たい」"}, {"land": "江州音頭（滋賀）", "level": "簡単", "q": "江州音頭は、どこの音頭でしょう？", "a": "滋賀県（近江）を中心に、近畿地方各地で盆踊りに用いられる音頭"}, {"land": "江州音頭（滋賀）", "level": "簡単", "q": "「江州」とは、どこの国の別称でしょう？", "a": "近江国"}, {"land": "江州音頭（滋賀）", "level": "簡単", "q": "江州音頭は、主にいつ踊られるでしょう？", "a": "夏のお盆（滋賀では8月の盆踊りとして定着。豊郷では千樹寺の観音盆）"}, {"land": "江州音頭（滋賀）", "level": "簡単", "q": "江州音頭を作り上げた、板前出身で「歌寅」と呼ばれた名人は誰でしょう？", "a": "西沢寅吉。歌が好きで「歌寅」と呼ばれ、桜川雛山に習った歌祭文に歌念仏・念仏踊りを取り入れて作り上げた"}, {"land": "江州音頭（滋賀）", "level": "簡単", "q": "豊郷の千樹寺で踊るとき、踊り手に手渡された華やかな小道具2つは何でしょう？", "a": "絵日傘と扇。今も豊郷では「絵日傘踊り」「扇踊り」として保存・継承されている"}, {"land": "江州音頭（滋賀）", "level": "むずかし", "q": "歌寅（西沢寅吉）が文政12年頃に師事した、武蔵国のデロレン祭文の名人は誰？", "a": "桜川雛山（万宝院桜川雛山）"}, {"land": "江州音頭（滋賀）", "level": "むずかし", "q": "歌寅が師の許しを得て名乗り、江州音頭の家元となった名前は？", "a": "初代桜川大龍"}, {"land": "江州音頭（滋賀）", "level": "むずかし", "q": "歌寅と協力して演目を整えた、もう一人の家元は誰？（真鍮細工が本業だった）", "a": "奥村久左衛門（初代真鍮家好文）。桜川派と真鍮家派の2流派が源流とされる"}, {"land": "江州音頭（滋賀）", "level": "むずかし", "q": "江州音頭が初めて披露されたと伝わる、豊郷町のお寺は？", "a": "千樹寺（日吉山千樹寺、豊郷町下枝）。発祥の地は八日市（考案の地、現・東近江市延命公園）と千樹寺の2か所とされる"}, {"land": "江州音頭（滋賀）", "level": "むずかし", "q": "江州音頭になる前、八日市で呼ばれていた直接の起源の名前は？", "a": "八日市祭文音頭（江州八日市祭文音頭）。大阪で河内音頭と並んで演じられるようになってから、区別のために「江州音頭」の呼び名が定着したとも言われる"}];
const $ = id => document.getElementById(id);
let landFilter="all", deck=[], idx=0, loop=1, n=0, score=0, streak=0, best=0;

/* --- SVG: 切り口ギザギザを生成 --- */
(function(){
  const W=384, H=10, step=12; let pts="0,0 "+W+",0 ";
  for(let x=W; x>=0; x-=step){ pts += x+","+(((x/step)%2===0)?H:0)+" "; }
  $("tearPoly").setAttribute("points", pts);
})();

/* --- SVG: バーコードを文字列から生成（バー幅＝文字コードのビット列） --- */
function drawBarcode(text){
  const svg=$("barcode"); svg.innerHTML="";
  let x=4;
  const bits=[];
  for(const ch of text){ const c=ch.charCodeAt(0); for(let i=6;i>=0;i--) bits.push((c>>i)&1); bits.push(0); }
  for(const b of bits){
    if(x>292) break;
    if(b===1){ const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x",x); r.setAttribute("y",2); r.setAttribute("width",2.4); r.setAttribute("height",50); r.setAttribute("fill","#111");
      svg.appendChild(r); }
    x += 3.4;
  }
  $("barcodeText").textContent = text;
}

/* --- SVG: 土地スタンプ --- */
const STAMPS={"安来節（島根）":["安来","島根"],"おてもやん（熊本）":["熊本","肥後"],"江州音頭（滋賀）":["江州","滋賀"]};
function setStamp(land){
  const s=STAMPS[land]; if(!s) return;
  $("stampLand").textContent=s[0]; $("stampSub").textContent=s[1];
  $("stamp").classList.remove("show"); void $("stamp").getBoundingClientRect(); $("stamp").classList.add("show");
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function build(){ deck = shuffle([...QUIZ.filter(x=>landFilter==="all"||x.land===landFilter)]); idx=0; }
function present(){
  const cur=deck[idx++]; n++;
  $("date").textContent=new Date().toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  $("no").textContent="No."+String(n).padStart(4,"0");
  $("loop").textContent=loop+"周目";
  $("land").textContent=cur.land; $("level").textContent="［"+cur.level+"］";
  $("q").textContent="Q. "+cur.q; $("atext").textContent=cur.a;
  $("answer").hidden=true; $("judge").hidden=true; $("show").hidden=false;
  $("cnt").textContent=n+" 問";
  setStamp(cur.land);
  drawBarcode("MINYO-"+String(n).padStart(4,"0")+"-"+score);
  window._cur=cur; window.scrollTo({top:0,behavior:"smooth"});
}
function next(){ if(idx>=deck.length){ loop++; build(); printLog("― "+loop+"周目 突入 ―"); } present(); }
function printLog(t){ const log=$("log"); if(log.querySelector(".mut")) log.innerHTML=""; log.innerHTML+=t+"<br>"; }
$("show").onclick=()=>{ $("answer").hidden=false; $("judge").hidden=false; $("show").hidden=true; };
function judge(ok){
  const cur=window._cur;
  if(ok){ score+=(cur.level==="むずかし"?2:1); streak++; best=Math.max(best,streak); } else streak=0;
  $("score").textContent=score+" 点"; $("total").textContent=score+" 点";
  $("streak").textContent=streak+"（最高 "+best+"）";
  printLog((ok?"◎":"×")+" "+cur.land.replace(/（.*）/,"")+"/"+cur.level+" … "+(ok?(cur.level==="むずかし"?"+2":"+1")+"点":"0点"));
  next();
}
$("ok").onclick=()=>judge(true);
$("ng").onclick=()=>judge(false);
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); b.classList.add("on");
  landFilter=b.dataset.land; loop=1; build(); printLog("【土地フィルタ: "+b.textContent+"】"); present();
});
build(); present();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
